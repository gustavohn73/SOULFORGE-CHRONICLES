<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soulforge Chronicles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        #login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
        }
        #login-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #f44;
        }
        #login-screen input {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
            width: 300px;
            background: #222;
            border: 2px solid #444;
            color: #fff;
        }
        #login-screen button {
            padding: 12px 30px;
            font-size: 18px;
            background: #f44;
            border: none;
            color: #fff;
            cursor: pointer;
            margin: 10px;
        }
        #login-screen button:hover {
            background: #f66;
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <h1>⚔️ SOULFORGE CHRONICLES ⚔️</h1>
        <p>Enter your username to begin</p>
        <input type="text" id="username-input" placeholder="Username" maxlength="20" />
        <button id="start-button">Enter the Loop</button>
        <p style="font-size: 12px; color: #888; margin-top: 20px;">
            Multiplayer Roguelike • Your choices forge your soul
        </p>
    </div>
    <div id="game-container"></div>
</body>
</html>
